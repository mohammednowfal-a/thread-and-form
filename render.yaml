# Render Blueprint. Review plans/regions before deploying. Secrets marked sync:false are entered in the Render dashboard.
databases:
  - name: threadform-db
    plan: basic-256mb
    databaseName: threadform
    user: threadform

services:
  - type: web
    name: thread-and-form
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    # `migrate deploy` only applies pending versioned migrations. It never resets or drops data.
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: DATABASE_URL, fromDatabase: { name: threadform-db, property: connectionString } }
      - { key: SESSION_SECRET, generateValue: true }
      - { key: JOBS_SECRET, generateValue: true }
      - { key: APP_URL, sync: false }
      - { key: STOREFRONT_TENANT_SLUG, value: thread-and-form }
      - { key: ALLOW_GUEST_CHECKOUT, value: "true" }
      - { key: WHATSAPP_PHONE_NUMBER_ID, sync: false }
      - { key: WHATSAPP_BUSINESS_ACCOUNT_ID, sync: false }
      - { key: WHATSAPP_ACCESS_TOKEN, sync: false }
      - { key: WHATSAPP_VERIFY_TOKEN, sync: false }
      - { key: WHATSAPP_APP_SECRET, sync: false }
      - { key: WHATSAPP_API_VERSION, value: v21.0 }
      - { key: WHATSAPP_TEMPLATE_COD_CONFIRM, value: cod_order_confirmation }
      - { key: WHATSAPP_TEMPLATE_ORDER_STATUS, value: order_status_update }
      - { key: WHATSAPP_TEMPLATE_LANGUAGE, value: en }
      - { key: EMAIL_API_KEY, sync: false }
      - { key: EMAIL_FROM, sync: false }
      - { key: AI_PROVIDER_API_KEY, sync: false }
      - { key: AI_PROVIDER_MODEL, sync: false }

  # Durable background worker: sends WhatsApp messages, retries failures with backoff, expires unconfirmed orders.
  - type: worker
    name: thread-and-form-worker
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: npm run worker
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: DATABASE_URL, fromDatabase: { name: threadform-db, property: connectionString } }
      - { key: SESSION_SECRET, sync: false }
      - { key: APP_URL, sync: false }
      - { key: STOREFRONT_TENANT_SLUG, value: thread-and-form }
      - { key: WHATSAPP_PHONE_NUMBER_ID, sync: false }
      - { key: WHATSAPP_ACCESS_TOKEN, sync: false }
      - { key: WHATSAPP_API_VERSION, value: v21.0 }
      - { key: WHATSAPP_TEMPLATE_COD_CONFIRM, value: cod_order_confirmation }
      - { key: WHATSAPP_TEMPLATE_ORDER_STATUS, value: order_status_update }
      - { key: WHATSAPP_TEMPLATE_LANGUAGE, value: en }
      - { key: EMAIL_API_KEY, sync: false }
      - { key: EMAIL_FROM, sync: false }
      - { key: AI_PROVIDER_API_KEY, sync: false }
      - { key: AI_PROVIDER_MODEL, sync: false }
